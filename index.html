<!DOCTYPE html>
<html lang="en" data-side="pretty">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pretty Killer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@700;900&family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600;800&display=swap">
<style>
/* same Pretty (AM) / Killer (PM) tokens as the other Pretty Killer sites */
:root{
  --ground:#f8d2e1; --surface:#fffafc; --ink:#161015; --muted:#8e5a73;
  --accent:#f25fc4; --accent-ink:#161015; --line:#e9b1c9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"Special Elite","Courier New",monospace;
  --radius:3px; --shadow:0 18px 28px -14px rgba(120,30,75,.45);
  --label-case:none; --label-track:.04em;
  color-scheme:light;
}
:root[data-side="killer"]{
  --ground:#09080a; --surface:#141216; --ink:#f2ecf0; --muted:#8c8390;
  --accent:#ff3fae; --accent-ink:#0a0a0a; --line:#2c272f;
  --display:"Anton","Impact",sans-serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:0px; --shadow:6px 6px 0 0 #ff3fae;
  --label-case:uppercase; --label-track:.14em;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;transition:background .3s,color .3s}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 56px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand b{font:900 22px/1 var(--display)}
[data-side="killer"] .brand b{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.side-pill{display:flex;align-items:center;gap:8px;background:var(--surface);padding:8px 12px;border-radius:999px;font:600 12px var(--mono);box-shadow:var(--shadow)}
.side-pill i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
[data-side="killer"] .side-pill{border-radius:0}

.hero{padding:36px 0 32px}
.eyebrow{font:600 13px var(--mono);text-transform:var(--label-case);letter-spacing:var(--label-track);color:var(--accent)}
.title{margin:12px 0 0;font:900 clamp(40px,9vw,104px)/.95 var(--display);display:flex;flex-wrap:wrap;gap:6px 4px}
.title .ch{display:inline-block;padding:2px 8px;background:var(--surface);transform:rotate(var(--r,0deg))}
.title .ch.dark{background:var(--ink);color:var(--accent)}
.title .word{display:inline-flex;gap:4px;white-space:nowrap}
.title .sp{width:.35em}
[data-side="killer"] .title{font-weight:400;text-transform:uppercase;color:var(--accent);gap:0}
[data-side="killer"] .title .ch{background:none;color:inherit;padding:0;transform:none}
[data-side="killer"] .title .word{gap:0}
.hero p{max-width:50ch;font-size:18px;margin:22px 0 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:18px}
.site{display:flex;flex-direction:column;gap:10px;background:var(--surface);color:var(--ink);text-decoration:none;padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);border-top:5px solid var(--accent);transition:transform .15s}
.site:hover,.site:focus-visible{transform:translateY(-3px)}
.site:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.site .ico{font-size:30px;line-height:1}
.site h2{margin:0;font:900 28px/1.1 var(--display)}
[data-side="killer"] .site h2{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.site p{margin:0;color:var(--muted);font-size:15px;flex:1}
.site .go{font:600 13px var(--mono);text-transform:var(--label-case);letter-spacing:var(--label-track);color:var(--accent)}
.site.big{grid-column:1/-1;background:var(--ink);color:var(--ground);border-top-color:var(--accent)}
.site.big p{color:inherit;opacity:.75}
.site.big h2{font-size:clamp(32px,6vw,48px)}
[data-side="killer"] .site.big{background:var(--accent);color:var(--accent-ink)}
[data-side="killer"] .site.big .go{color:inherit}
footer{margin-top:36px;font:12px var(--mono);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><b>Finn Shapiro</b></div>
    <div class="side-pill"><i></i><span id="sideName">AM · Pretty side</span></div>
  </header>

  <section class="hero">
    <span class="eyebrow">Everything Pretty Killer, in one place</span>
    <h1 class="title" id="title" aria-label="Pretty Killer"></h1>
    <p>Two shows, one ticket. The Pretty side in the morning, the Killer side at night.</p>
  </section>

  <main class="grid" id="grid"></main>

  <footer>© 2026 Finn Shapiro · Pretty Killer Tour</footer>
</div>

<script>
/* =====================================================================
   THE SITES: add, remove or reorder them here. big: true = a full-width card.
   ===================================================================== */
const T = "https://qwerty-ally.github.io/pretty-killer-tickets/";
const SITES = [
  { ico:"🎟️", name:"Tickets",       text:"Get your free seat. One ticket works for both the Pretty and the Killer show.", url:T, go:"Get a ticket", big:true },
  { ico:"📋", name:"Show day info", text:"When doors open, where to go, the seats and the merch stand.", url:T + "info.html", go:"See the info" },
  { ico:"🎵", name:"Tracklist",     text:"15 Pretty songs and 15 Killer songs. Vote for the ones you want to hear.", url:T + "#tracklist", go:"See the songs" },
  { ico:"📸", name:"Photo booth",   text:"Take a photo or a 3-photo strip with a Pretty or Killer frame.", url:T + "booth.html", go:"Open the booth" },
  { ico:"✍️", name:"Guestbook",     text:"Leave Finn a message. Opens 50 minutes after each show starts.", url:T + "#guestbook", go:"Sign the guestbook" },
  { ico:"👀", name:"Leaks",         text:"Snippets and teasers before anyone else.", url:"https://qwerty-ally.github.io/pretty-killer-leaks/", go:"See the leaks" }
];

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
$("#grid").innerHTML = SITES.map(s => `<a class="site${s.big ? " big" : ""}" href="${esc(s.url)}">
  <span class="ico" aria-hidden="true">${s.ico}</span><h2>${esc(s.name)}</h2><p>${esc(s.text)}</p><span class="go">${esc(s.go)} →</span></a>`).join("");

// ransom-note title on the Pretty side, plain on the Killer side
const tilt = [-5, 3, -2, 6, -4, 2];
let n = 0;   // letter count across both words, for the tilt and dark tiles
$("#title").innerHTML = "Pretty Killer".split(" ").map(w => `<span class="word">${[...w].map(ch => { const i = n++;
  return `<span class="ch${i % 3 === 1 ? " dark" : ""}" style="--r:${tilt[i % tilt.length]}deg" aria-hidden="true">${ch}</span>`; }).join("")}</span>`).join(`<span class="sp"></span>`);

const clockSide = () => new Date().getHours() < 12 ? "pretty" : "killer";
function setSide(s){
  document.documentElement.dataset.side = s;
  $("#sideName").textContent = s === "pretty" ? "AM · Pretty side" : "PM · Killer side";
}
setSide(clockSide());
setInterval(() => setSide(clockSide()), 60000);
</script>
</body>
</html>
